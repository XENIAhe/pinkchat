<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>粉粉聊天 · AI 对话</title>
  <link rel="preload" as="script" href="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous">
  <link rel="preload" as="script" href="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous">
  <link rel="preload" as="script" href="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous">
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://sf3-scmcdn-cn.feishucdn.com/obj/feishu-static/miaoda/coding-unpkg-sdk/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --pink-50: #FFF5F8;
      --pink-100: #FFE8EF;
      --pink-200: #FFD1DE;
      --pink-300: #FFB1C6;
      --pink-400: #FF8BAA;
      --pink-500: #FF6B95;
      --pink-600: #EC497A;
      --pink-700: #C93261;
      --pink-800: #A0264C;
      --pink-900: #7A1C3A;
      --text-primary: #5A1A2E;
      --text-secondary: #9A4A60;
      --text-muted: #C08497;
      --bg-gradient-start: #FFF0F5;
      --bg-gradient-end: #FFE0EC;
      --glass-bg: rgba(255, 255, 255, 0.72);
      --glass-border: rgba(255, 182, 193, 0.4);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "HarmonyOS Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: var(--text-primary);
      background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    #root {
      height: 100%;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
      background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
    }

    /* 顶部导航栏 */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      position: relative;
      z-index: 10;
      flex-shrink: 0;
    }

    .top-bar-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-bar-title h1 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }

    .logo-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(236, 73, 122, 0.3);
    }

    .top-bar-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: var(--pink-100);
      color: var(--pink-700);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: var(--pink-200);
    }

    /* 消息列表 */
    .message-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      -webkit-overflow-scrolling: touch;
    }

    .message-list::-webkit-scrollbar {
      width: 0;
      display: none;
    }

    .message-row {
      display: flex;
      gap: 8px;
      max-width: 100%;
    }

    .message-row.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .avatar.ai {
      background: linear-gradient(135deg, var(--pink-400), var(--pink-600));
      color: white;
      box-shadow: 0 2px 6px rgba(236, 73, 122, 0.25);
    }

    .avatar.user {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: white;
    }

    .message-bubble {
      max-width: calc(100% - 48px);
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.6;
      word-wrap: break-word;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .message-row.ai .message-bubble {
      background: white;
      color: var(--text-primary);
      border-bottom-left-radius: 6px;
      box-shadow: 0 1px 3px rgba(236, 73, 122, 0.08);
      border: 1px solid var(--pink-100);
    }

    .message-row.user .message-bubble {
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: white;
      border-bottom-right-radius: 6px;
      box-shadow: 0 2px 8px rgba(255, 107, 149, 0.3);
    }

    /* 打字指示器 */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 4px 0;
    }

    .typing-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--pink-400);
      animation: typingBounce 1.4s infinite ease-in-out;
    }

    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* 空状态 */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-state-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pink-200), var(--pink-300));
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(255, 139, 170, 0.3);
    }

    .empty-state h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 280px;
    }

    /* 底部输入区 */
    .input-area {
      flex-shrink: 0;
      padding: 10px 12px calc(var(--safe-bottom) + 10px);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--glass-border);
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: white;
      border-radius: 22px;
      padding: 6px 6px 6px 16px;
      border: 1.5px solid var(--pink-200);
      box-shadow: 0 2px 10px rgba(255, 182, 193, 0.2);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--pink-400);
      box-shadow: 0 2px 16px rgba(255, 139, 170, 0.3);
    }

    .input-textarea {
      flex: 1;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font-size: 15px;
      line-height: 1.5;
      max-height: 120px;
      min-height: 28px;
      padding: 6px 0;
      color: var(--text-primary);
      font-family: inherit;
    }

    .input-textarea::placeholder {
      color: var(--text-muted);
    }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .send-btn:active {
      transform: scale(0.92);
    }

    .send-btn:disabled {
      background: var(--pink-200);
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* 弹窗遮罩 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(90, 26, 46, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
      opacity: 0;
      animation: fadeIn 0.25s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    .modal {
      background: white;
      border-radius: 20px;
      padding: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 32px rgba(236, 73, 122, 0.2);
      transform: scale(0.95) translateY(10px);
      animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes modalIn {
      to { transform: scale(1) translateY(0); }
    }

    .modal h3 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .modal-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--pink-200);
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
      font-family: inherit;
      color: var(--text-primary);
      background: var(--pink-50);
    }

    .input-field:focus {
      border-color: var(--pink-400);
    }

    .input-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
      display: block;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--pink-400), var(--pink-500));
      color: white;
      box-shadow: 0 2px 8px rgba(255, 107, 149, 0.3);
    }

    .btn-secondary {
      background: var(--pink-100);
      color: var(--pink-700);
    }

    .btn-danger {
      background: #FFE0E0;
      color: #D32F2F;
    }

    /* Toast 提示 */
    .toast-container {
      position: fixed;
      top: calc(var(--safe-top) + 60px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }

    .toast {
      background: rgba(90, 26, 46, 0.88);
      color: white;
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      backdrop-filter: blur(10px);
      animation: toastIn 0.3s ease, toastOut 0.3s ease 2.2s forwards;
      max-width: 80vw;
      text-align: center;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-10px); }
    }

    /* 快捷提示 */
    .quick-tips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      justify-content: center;
    }

    .quick-tip-chip {
      padding: 8px 14px;
      background: white;
      border: 1px solid var(--pink-200);
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quick-tip-chip:active {
      transform: scale(0.96);
      background: var(--pink-100);
    }

    /* 错误消息 */
    .error-bubble {
      background: #FFF0F0 !important;
      color: #D32F2F !important;
      border-color: #FFCDD2 !important;
    }

    /* 代码块 */
    .message-bubble code {
      background: rgba(255, 182, 193, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 13px;
      font-family: "SF Mono", "Menlo", "Consolas", monospace;
    }

    .message-bubble pre {
      background: var(--pink-900);
      color: var(--pink-100);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
      font-size: 13px;
    }

    .message-bubble pre code {
      background: transparent;
      padding: 0;
      color: inherit;
    }

    /* 确认对话框 */
    .confirm-modal .modal-actions {
      flex-direction: row-reverse;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const STORAGE_KEY_API = 'deepseek_api_key';
const STORAGE_KEY_MESSAGES = 'deepseek_chat_messages';
const DEEPSEEK_API_URL = 'https://api.deepseek.com/chat/completions';
const DEEPSEEK_MODEL = 'deepseek-flash';

// SVG 图标组件
const Icons = {
  Send: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <line x1="22" y1="2" x2="11" y2="13"></line>
      <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
    </svg>
  ),
  Settings: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </svg>
  ),
  Trash: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    </svg>
  ),
  Bot: () => (
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <rect x="3" y="11" width="18" height="10" rx="2"></rect>
      <circle cx="12" cy="5" r="2"></circle>
      <path d="M12 7v4"></path>
      <line x1="8" y1="16" x2="8.01" y2="16"></line>
      <line x1="16" y1="16" x2="16.01" y2="16"></line>
    </svg>
  ),
  User: () => (
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
  ),
  Heart: () => (
    <svg width="36" height="36" viewBox="0 0 24 24" fill="white" stroke="white" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
    </svg>
  ),
  Sparkles: () => (
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"></path>
    </svg>
  ),
};

// Toast 组件
function Toast({ message, id }) {
  return <div className="toast" key={id}>{message}</div>;
}

// 打字指示器
function TypingIndicator() {
  return (
    <div className="message-row ai">
      <div className="avatar ai">
        <Icons.Bot />
      </div>
      <div className="message-bubble">
        <div className="typing-indicator">
          <div className="typing-dot"></div>
          <div className="typing-dot"></div>
          <div className="typing-dot"></div>
        </div>
      </div>
    </div>
  );
}

// 消息气泡
function MessageBubble({ message }) {
  const isUser = message.role === 'user';
  const isError = message.isError;

  return (
    <div className={`message-row ${isUser ? 'user' : 'ai'}`}>
      <div className={`avatar ${isUser ? 'user' : 'ai'}`}>
        {isUser ? <Icons.User /> : <Icons.Bot />}
      </div>
      <div className={`message-bubble ${isError ? 'error-bubble' : ''}`}>
        {message.content}
      </div>
    </div>
  );
}

// API Key 设置弹窗
function ApiKeyModal({ isOpen, onClose, onSave, currentKey }) {
  const [key, setKey] = useState(currentKey || '');

  useEffect(() => {
    setKey(currentKey || '');
  }, [currentKey, isOpen]);

  if (!isOpen) return null;

  const handleSave = () => {
    const trimmed = key.trim();
    if (!trimmed) {
      onSave('');
      return;
    }
    if (!trimmed.startsWith('sk-')) {
      alert('API Key 格式不正确，应为 sk- 开头的字符串');
      return;
    }
    onSave(trimmed);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h3>设置 API Key</h3>
        <p className="modal-desc">
          输入你的 DeepSeek API Key，密钥仅保存在你的浏览器本地，不会上传到任何服务器。
          <br /><br />
          没有 Key？前往 <a href="https://platform.deepseek.com/" target="_blank" rel="noopener noreferrer" style={{ color: '#EC497A' }}>DeepSeek 开放平台</a> 申请。
        </p>
        <label className="input-label">DeepSeek API Key</label>
        <input
          type="password"
          className="input-field"
          placeholder="sk-xxxxxxxxxxxxxxxx"
          value={key}
          onChange={(e) => setKey(e.target.value)}
          autoFocus
        />
        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onClose}>取消</button>
          <button className="btn btn-primary" onClick={handleSave}>保存</button>
        </div>
      </div>
    </div>
  );
}

// 确认弹窗
function ConfirmModal({ isOpen, title, message, onConfirm, onCancel, confirmText = '确认', cancelText = '取消' }) {
  if (!isOpen) return null;

  return (
    <div className="modal-overlay confirm-modal" onClick={onCancel}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h3>{title}</h3>
        <p className="modal-desc" style={{ marginBottom: 0 }}>{message}</p>
        <div className="modal-actions">
          <button className="btn btn-secondary" onClick={onCancel}>{cancelText}</button>
          <button className="btn btn-danger" onClick={onConfirm}>{confirmText}</button>
        </div>
      </div>
    </div>
  );
}

// 快捷提示词
const QUICK_TIPS = [
  '讲个冷笑话',
  '帮我写首诗',
  '今天心情不太好',
  '推荐一部电影',
];

// 主应用
function App() {
  const [apiKey, setApiKey] = useState('');
  const [messages, setMessages] = useState([]);
  const [inputText, setInputText] = useState('');
  const [isLoading, setIsLoading] = useState(false);
  const [showApiKeyModal, setShowApiKeyModal] = useState(false);
  const [showClearConfirm, setShowClearConfirm] = useState(false);
  const [toasts, setToasts] = useState([]);

  const messagesEndRef = useRef(null);
  const textareaRef = useRef(null);
  const toastIdRef = useRef(0);

  // 初始化：从 localStorage 读取
  useEffect(() => {
    const savedKey = localStorage.getItem(STORAGE_KEY_API);
    if (savedKey) {
      setApiKey(savedKey);
    } else {
      // 没有 Key 时直接弹出设置
      setShowApiKeyModal(true);
    }

    const savedMessages = localStorage.getItem(STORAGE_KEY_MESSAGES);
    if (savedMessages) {
      try {
        const parsed = JSON.parse(savedMessages);
        if (Array.isArray(parsed)) {
          setMessages(parsed);
        }
      } catch (e) {
        console.error('Failed to parse saved messages');
      }
    }
  }, []);

  // 保存消息到 localStorage
  useEffect(() => {
    if (messages.length > 0) {
      localStorage.setItem(STORAGE_KEY_MESSAGES, JSON.stringify(messages));
    } else {
      localStorage.removeItem(STORAGE_KEY_MESSAGES);
    }
  }, [messages]);

  // 滚动到底部
  const scrollToBottom = useCallback(() => {
    messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, []);

  useEffect(() => {
    scrollToBottom();
  }, [messages, isLoading, scrollToBottom]);

  // 自动调整 textarea 高度
  useEffect(() => {
    const textarea = textareaRef.current;
    if (textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
    }
  }, [inputText]);

  // Toast
  const showToast = useCallback((message) => {
    const id = ++toastIdRef.current;
    setToasts((prev) => [...prev, { id, message }]);
    setTimeout(() => {
      setToasts((prev) => prev.filter((t) => t.id !== id));
    }, 2500);
  }, []);

  // 保存 API Key
  const handleSaveApiKey = (key) => {
    setApiKey(key);
    if (key) {
      localStorage.setItem(STORAGE_KEY_API, key);
      showToast('API Key 已保存');
    } else {
      localStorage.removeItem(STORAGE_KEY_API);
      showToast('API Key 已清除');
    }
    setShowApiKeyModal(false);
  };

  // 清空会话
  const handleClearChat = () => {
    setMessages([]);
    setShowClearConfirm(false);
    showToast('会话已清空');
  };

  // 发送消息
  const handleSend = useCallback(async () => {
    const text = inputText.trim();
    if (!text || isLoading) return;

    if (!apiKey) {
      setShowApiKeyModal(true);
      showToast('请先设置 API Key');
      return;
    }

    // 添加用户消息
    const userMessage = { role: 'user', content: text };
    setMessages((prev) => [...prev, userMessage]);
    setInputText('');
    setIsLoading(true);

    try {
      // 构建消息历史（排除错误消息）
      const historyMessages = messages
        .filter((m) => !m.isError)
        .map((m) => ({ role: m.role, content: m.content }));

      const response = await fetch(DEEPSEEK_API_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`,
        },
        body: JSON.stringify({
          model: DEEPSEEK_MODEL,
          messages: [...historyMessages, userMessage],
          temperature: 0.7,
          max_tokens: 2000,
        }),
      });

      if (!response.ok) {
        let errorMsg = `请求失败 (${response.status})`;
        try {
          const errData = await response.json();
          if (errData.error?.message) {
            errorMsg = errData.error.message;
          }
        } catch (e) {
          // ignore
        }
        if (response.status === 401) {
          errorMsg = 'API Key 无效，请检查密钥是否正确';
        } else if (response.status === 429) {
          errorMsg = '请求过于频繁，请稍后再试';
        } else if (response.status === 404) {
          errorMsg = 'API 地址错误，请检查网络连接';
        }
        throw new Error(errorMsg);
      }

      const data = await response.json();
      const aiContent = data.choices?.[0]?.message?.content || '';

      if (!aiContent) {
        throw new Error('未收到有效回复');
      }

      setMessages((prev) => [...prev, { role: 'assistant', content: aiContent }]);

    } catch (error) {
      console.error('API Error:', error);
      let errorMessage = error.message || '未知错误';

      // 网络错误提示
      if (error.message.includes('Failed to fetch') || error.message.includes('NetworkError')) {
        errorMessage = '网络连接失败，请检查网络或尝试切换网络环境';
      }

      setMessages((prev) => [
        ...prev,
        { role: 'assistant', content: `抱歉，出错了：${errorMessage}`, isError: true },
      ]);
    } finally {
      setIsLoading(false);
    }
  }, [inputText, isLoading, apiKey, messages, showToast]);

  // 键盘事件处理
  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.nativeEvent.isComposing) {
      e.preventDefault();
      handleSend();
    }
  };

  // 快捷提示词
  const handleQuickTip = (tip) => {
    setInputText(tip);
    textareaRef.current?.focus();
  };

  return (
    <div className="app-container">
      {/* 顶部导航 */}
      <div className="top-bar">
        <div className="top-bar-title">
          <div className="logo-dot">
            <Icons.Sparkles />
          </div>
          <h1>粉粉聊天</h1>
        </div>
        <div className="top-bar-actions">
          <button
            className="icon-btn"
            onClick={() => setShowClearConfirm(true)}
            title="清空会话"
            disabled={messages.length === 0}
            style={{ opacity: messages.length === 0 ? 0.4 : 1 }}
          >
            <Icons.Trash />
          </button>
          <button
            className="icon-btn"
            onClick={() => setShowApiKeyModal(true)}
            title="设置 API Key"
          >
            <Icons.Settings />
          </button>
        </div>
      </div>

      {/* 消息列表 */}
      <div className="message-list">
        {messages.length === 0 ? (
          <div className="empty-state">
            <div className="empty-state-icon">
              <Icons.Heart />
            </div>
            <h2>你好呀</h2>
            <p>我是你的 AI 小助手，有什么想聊的吗？</p>
            <div className="quick-tips">
              {QUICK_TIPS.map((tip) => (
                <div
                  key={tip}
                  className="quick-tip-chip"
                  onClick={() => handleQuickTip(tip)}
                >
                  {tip}
                </div>
              ))}
            </div>
          </div>
        ) : (
          messages.map((msg, index) => (
            <MessageBubble key={index} message={msg} />
          ))
        )}
        {isLoading && <TypingIndicator />}
        <div ref={messagesEndRef} />
      </div>

      {/* 底部输入区 */}
      <div className="input-area">
        <div className="input-wrapper">
          <textarea
            ref={textareaRef}
            className="input-textarea"
            placeholder="说点什么吧…"
            value={inputText}
            onChange={(e) => setInputText(e.target.value)}
            onKeyDown={handleKeyDown}
            rows={1}
          />
          <button
            className="send-btn"
            onClick={handleSend}
            disabled={!inputText.trim() || isLoading}
          >
            <Icons.Send />
          </button>
        </div>
      </div>

      {/* API Key 设置弹窗 */}
      <ApiKeyModal
        isOpen={showApiKeyModal}
        onClose={() => {
          if (!apiKey && messages.length === 0) {
            // 首次使用没有 key 时，允许关闭但提示
            showToast('设置 API Key 后即可开始对话');
          }
          setShowApiKeyModal(false);
        }}
        onSave={handleSaveApiKey}
        currentKey={apiKey}
      />

      {/* 清空确认弹窗 */}
      <ConfirmModal
        isOpen={showClearConfirm}
        title="清空会话"
        message="确定要清空所有对话记录吗？此操作不可撤销。"
        confirmText="清空"
        cancelText="取消"
        onConfirm={handleClearChat}
        onCancel={() => setShowClearConfirm(false)}
      />

      {/* Toast */}
      <div className="toast-container">
        {toasts.map((t) => (
          <Toast key={t.id} message={t.message} id={t.id} />
        ))}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
